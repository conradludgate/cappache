[package]
name = "clache"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
clashcore = { git = "https://github.com/conradludgate/clashmap.git", branch = "phase-2/hashbrown-0.17" }
hashbrown = "0.17"
pin-project-lite = "0.2"
slotmap = "1"
tokio = { version = "1", features = ["sync"] }
typesize = { version = "0.1", default-features = false, features = ["std"], optional = true }

[features]
default = []
# Enables `typesize::TypeSize` impls on the public cache types so callers can
# fetch a deep memory-usage estimate for debugging. Acquires every shard
# write lock and walks every slab entry; do not enable for hot paths.
typesize = ["dep:typesize"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
moka = { version = "0.12", default-features = false, features = ["sync"] }
quick_cache = { version = "0.6", default-features = false }
fastrand = "2"

[[bench]]
name = "compare_cache"
harness = false

[[bench]]
name = "concurrent"
harness = false
