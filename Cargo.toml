[package]
name = "clache"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
hashbrown = "0.17"
pin-project-lite = "0.2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
moka = { version = "0.12", default-features = false, features = ["sync"] }
quick_cache = { version = "0.6", default-features = false }
fastrand = "2"
# Trace-driven comparison harness. Path points at the in-tree fork of
# moka-rs/mokabench (third-party/mokabench is a submodule); the `clache`
# feature reaches back through `path = "../.."` to this crate.
mokabench = { path = "third-party/mokabench", default-features = false, features = [
    "clache",
    "moka-v012",
    "quick_cache",
    "rt-tokio",
] }
anyhow = "1"

[[bench]]
name = "compare_cache"
harness = false
