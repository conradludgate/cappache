name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        args: ['', '--features typesize']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked ${{ matrix.args }} -- -D warnings
      - run: cargo test --locked ${{ matrix.args }}
      - run: cargo test --release --locked --test weight_overflow ${{ matrix.args }}

  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --locked --lib
      - run: cargo check --locked --lib --features typesize
